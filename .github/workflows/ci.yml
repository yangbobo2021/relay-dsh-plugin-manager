name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:dry-run
      - run: npm audit --omit=dev --audit-level=moderate

  package-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - run: npm ci --ignore-scripts
      - run: pnpm install --dir test/fixtures/dsh-runtime --frozen-lockfile --ignore-scripts
      - run: npm run build
      - run: npm run acceptance
        env:
          DSH_CLI_PATH: ${{ github.workspace }}/test/fixtures/dsh-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js
